<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Inbox</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header><h1>Agent Inbox</h1><span id="status"></span></header>
  <div class="layout">
    <nav id="sidebar" aria-label="Sections">
      <div class="nav-group"><a href="#needsYou" data-target="needsYou">Needs you</a><div class="sub" data-sub="needsYou"></div></div>
      <div class="nav-group"><a href="#boards" data-target="boards">Tracking</a><div class="sub" data-sub="boards"></div></div>
      <div class="nav-group"><a href="#notes" data-target="notes">Notes</a><div class="sub" data-sub="notes"></div></div>
      <div class="nav-group"><a href="#done" data-target="done">Done</a><div class="sub" data-sub="done"></div></div>
    </nav>
    <main>
      <details class="section" id="needsYou" open><summary><h2>Needs you</h2></summary><div class="groups"></div></details>
      <details class="section" id="boards" open><summary><h2>Tracking</h2></summary><div class="boards"></div></details>
      <details class="section" id="notes" open><summary><h2>Notes</h2></summary><div class="groups"></div></details>
      <details class="section" id="done"><summary><h2>Done</h2></summary><div class="items"></div></details>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
