name: Windows installer spike

# #87 PR 2a, CI only. Builds a per-user MSI (WiX) and a Squirrel.Windows
# installer from the verified Windows x64 folder, with pinned tools, and measures
# both on the runner as a disposable standard user. Nothing here is signed,
# published or released: docs/superpowers/specs/2026-10-23-windows-installer-decision.md
# records the results and the recommendation.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-installer-spike.yml"
      - ".github/workflows/windows-native-folder.yml"
      - ".github/windows-installer-spike/**"
      - "test/windows-installer-spike.test.ts"

permissions:
  contents: read

concurrency:
  group: windows-installer-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every npm install in this workflow compiles better-sqlite3 rather than load an
  # unpinned prebuild; no job or step may override it (#315).
  npm_config_build_from_source: "true"

jobs:
  folder:
    name: Verified folder
    uses: ./.github/workflows/windows-native-folder.yml

  upgrade-folder:
    name: Upgrade folder / win32-x64
    runs-on: windows-2022
    outputs:
      base-version: ${{ steps.versions.outputs.base }}
      upgrade-version: ${{ steps.versions.outputs.upgrade }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release-inputs
        name: Resolve pinned Node version
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          "node-version=$(node scripts/windows-release-inputs.mjs --node-version)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      # No npm cache, restored or automatic (#315).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.release-inputs.outputs.node-version }}
          architecture: x64
          package-manager-cache: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      # The upgrade build is this commit with only its version bumped, committed
      # locally so the build's source provenance stays clean and exact.
      - id: versions
        name: Commit a one-patch version bump
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node .github/windows-installer-spike/bump-version.mjs --print |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          node .github/windows-installer-spike/bump-version.mjs --apply
          git -c user.name="Windows installer spike" -c user.email="windows-installer-spike@users.noreply.github.com" `
            commit --quiet --no-verify -m "Windows installer spike: upgrade build" -- package.json package-lock.json src/version.ts
          "AGENT_INBOX_RELEASE_SOURCE_SHA=$(git rev-parse HEAD)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - name: Build the upgrade folder with the verified folder's builder
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build
          npm run --silent stage:runtime:native -- `
            --key win32-x64 `
            --inputs release/windows-inputs.json `
            --output build/runtime/win32-x64 | Out-Null
          npm run package:windows-thin -- `
            --runtime build/runtime/win32-x64 `
            --inputs release/windows-inputs.json `
            --output "build/thin/win32-x64/Agent Inbox"
          node scripts/archive-tree.mjs create `
            --source "build/thin/win32-x64/Agent Inbox" `
            --archive build/win32-x64-folder.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-spike-upgrade-folder
          path: |
            build/win32-x64-folder.tar.gz
            build/thin/win32-x64/Agent Inbox.thin-report.json
          if-no-files-found: error
          retention-days: 1

  installers:
    name: MSI and Squirrel / win32-x64
    needs: [folder, upgrade-folder]
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SPIKE: .github/windows-installer-spike
      SPIKE_SHARED: C:\ai-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release-inputs
        name: Resolve pinned Node version
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          "node-version=$(node scripts/windows-release-inputs.mjs --node-version)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      # No npm cache, restored or automatic (#315).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.release-inputs.outputs.node-version }}
          architecture: x64
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-win32-x64-folder-inputs
          path: build/spike/artifacts/base
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer-spike-upgrade-folder
          path: build/spike/artifacts/upgrade
      - name: Restore both folders and match their verified tree digests
        shell: pwsh
        env:
          BASE_VERSION: ${{ needs.upgrade-folder.outputs.base-version }}
          UPGRADE_VERSION: ${{ needs.upgrade-folder.outputs.upgrade-version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node "$env:SPIKE/prepare-folders.mjs" `
            --base build/spike/artifacts/base `
            --upgrade build/spike/artifacts/upgrade `
            --destination build/spike/folders `
            --base-version $env:BASE_VERSION `
            --upgrade-version $env:UPGRADE_VERSION `
            --out build/spike/folders.json
      - name: Install the pinned WiX tool
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force build/spike/reports | Out-Null
          & "$env:SPIKE/install-wix.ps1" -Destination build/spike/tools/wix -Report build/spike/reports/wix-tool.json
      - name: Install the pinned Squirrel tooling
        shell: pwsh
        working-directory: .github/windows-installer-spike
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --ignore-scripts --omit=optional --no-audit --no-fund
          # electron-winstaller's one install script copies the host's 7-Zip into vendor/.
          Push-Location node_modules/electron-winstaller
          try { node script/select-7z-arch.js } finally { Pop-Location }
      - id: msi-build
        name: Build both MSIs
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $wix = (Get-Content -Raw build/spike/reports/wix-tool.json | ConvertFrom-Json).wix
          foreach ($side in 'base', 'upgrade') {
            & "$env:SPIKE/build-msi.ps1" `
              -App (Resolve-Path "build/spike/folders/$side/Agent Inbox").Path `
              -Output build/spike/builds/msi `
              -Wix $wix `
              -Icon (Resolve-Path electron/icon.ico).Path `
              -Report "build/spike/builds/msi/$side.json"
          }
      - id: squirrel-build
        name: Build both Squirrel installers
        shell: pwsh
        env:
          DEBUG: electron-windows-installer:*
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($side in 'base', 'upgrade') {
            node "$env:SPIKE/build-squirrel.mjs" `
              --app "build/spike/folders/$side/Agent Inbox" `
              --output "build/spike/builds/squirrel/$side" `
              --work "$env:RUNNER_TEMP/squirrel-$side" `
              --icon electron/icon.ico `
              --icon-url "file:///C:/ai-spike/agent-inbox.ico" `
              --report "build/spike/builds/squirrel/$side.json"
          }
      - name: Record the signing surface
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $msi = (Get-Content -Raw build/spike/builds/msi/base.json | ConvertFrom-Json).msi.name
          & "$env:SPIKE/signing-surface.ps1" `
            -Folder "build/spike/folders/base/Agent Inbox" `
            -Msi "build/spike/builds/msi/$msi" `
            -SquirrelBuild build/spike/builds/squirrel/base `
            -Report build/spike/reports/signatures.json
      - name: Prepare the standard users' workspace
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force $env:SPIKE_SHARED, build/spike/results | Out-Null
          Copy-Item electron/icon.ico (Join-Path $env:SPIKE_SHARED 'agent-inbox.ico')
      - name: MSI lifecycle as a standard user
        if: ${{ !cancelled() && steps.msi-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:SPIKE/lifecycle.ps1" -Kind msi -Build build/spike/builds/msi -Folders build/spike/folders.json `
            -Shared $env:SPIKE_SHARED -UserName spikemsi -Port 14410 -Out build/spike/results/msi.json
      - name: Squirrel lifecycle as a standard user
        if: ${{ !cancelled() && steps.squirrel-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:SPIKE/lifecycle.ps1" -Kind squirrel -Build build/spike/builds/squirrel -Folders build/spike/folders.json `
            -Shared $env:SPIKE_SHARED -UserName spikesqr -Port 14420 -Out build/spike/results/squirrel.json
      - name: Summarize the measurements
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($kind in 'msi', 'squirrel') {
            foreach ($part in 'results', 'logs') {
              $source = Join-Path $env:SPIKE_SHARED "$kind\$part"
              if (Test-Path $source) {
                New-Item -ItemType Directory -Force "build/spike/lifecycle/$kind" | Out-Null
                Copy-Item -Recurse -Force $source "build/spike/lifecycle/$kind/$part"
              }
            }
          }
          node "$env:SPIKE/summary.mjs" --evidence build/spike --summary $env:GITHUB_STEP_SUMMARY `
            --out build/spike/report.json --assert-msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: windows-installer-spike-evidence
          path: |
            build/spike/report.json
            build/spike/folders.json
            build/spike/reports/
            build/spike/builds/**/*.json
            build/spike/results/
            build/spike/lifecycle/
          if-no-files-found: warn
          retention-days: 7
      # Unsigned spike builds for manual tests on a clean machine; never a release asset.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.msi-build.outcome == 'success' && steps.squirrel-build.outcome == 'success' }}
        with:
          name: windows-installer-spike-unsigned-installers
          path: |
            build/spike/builds/msi/*.msi
            build/spike/builds/squirrel/*/*-setup.exe
          if-no-files-found: error
          retention-days: 7
