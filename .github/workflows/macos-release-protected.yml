name: Notarized macOS release

on:
  workflow_run:
    workflows:
      - "macOS release inputs"
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: macos-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize trusted release source
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.name == 'macOS release inputs' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
      source-commit: ${{ steps.context.outputs.source-commit }}
      trusted-sha: ${{ steps.trust.outputs.trusted-sha }}
      run-id: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - id: release-inputs
        name: Resolve trusted pinned Node version
        run: echo "node-version=$(node scripts/release-inputs.mjs --node-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.release-inputs.outputs.node-version }}
      - name: Require the triggering workflow's trusted repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TRUSTED_WORKFLOW_ID="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/macos-release.yml" \
            --jq .id)"
          test "$TRUSTED_WORKFLOW_ID" = "${{ github.event.workflow_run.workflow_id }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-context
          path: build/untrusted-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: context
        name: Parse unprivileged release context with trusted code
        run: >-
          node scripts/macos-release-gates.mjs context
          --input build/untrusted-context/release-context.json
      - id: trust
        name: Require annotated tag on trusted default first-parent history
        run: |
          set -euo pipefail
          node scripts/macos-release-gates.mjs authorize \
            --repo-root "$GITHUB_WORKSPACE" \
            --input build/untrusted-context/release-context.json \
            --trusted-sha "${{ github.workflow_sha }}" \
            --run-head-sha "${{ github.event.workflow_run.head_sha }}" \
            --output build/trusted-release-context.json >/dev/null
          echo "trusted-sha=${{ github.workflow_sha }}" >> "$GITHUB_OUTPUT"

  verify-handoff:
    name: Verify handoff / ${{ needs.authorize.outputs.tag }} @ ${{ needs.authorize.outputs.source-commit }}
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.release-inputs.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.source-commit }}
      - id: release-inputs
        name: Resolve source-commit Node version
        run: echo "node-version=$(node scripts/release-inputs.mjs --node-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.release-inputs.outputs.node-version }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-context
          path: build/upstream-context
          run-id: ${{ needs.authorize.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-thin-darwin-*
          path: build/upstream-thin
          merge-multiple: true
          run-id: ${{ needs.authorize.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Revalidate source context and bind exact thin artifacts
        run: |
          set -euo pipefail
          node scripts/macos-release-gates.mjs tag \
            --repo-root "$GITHUB_WORKSPACE" \
            --ref "refs/tags/${{ needs.authorize.outputs.tag }}" \
            --sha "${{ needs.authorize.outputs.source-commit }}" \
            --output build/source-release-context.json >/dev/null
          cmp build/upstream-context/release-context.json build/source-release-context.json
          mkdir -p build/verified-thin
          node scripts/archive-tree.mjs extract \
            --archive build/upstream-thin/thin-darwin-arm64.tar.gz \
            --destination build/verified-thin \
            --expected-root darwin-arm64
          node scripts/archive-tree.mjs extract \
            --archive build/upstream-thin/thin-darwin-x64.tar.gz \
            --destination build/verified-thin \
            --expected-root darwin-x64
          node scripts/macos-release-gates.mjs thin-handoff \
            --context build/source-release-context.json \
            --arm64-archive build/upstream-thin/thin-darwin-arm64.tar.gz \
            --x64-archive build/upstream-thin/thin-darwin-x64.tar.gz \
            --arm64-app "build/verified-thin/darwin-arm64/Agent Inbox.app" \
            --x64-app "build/verified-thin/darwin-x64/Agent Inbox.app" \
            --arm64-report "build/verified-thin/darwin-arm64/Agent Inbox.app.thin-report.json" \
            --x64-report "build/verified-thin/darwin-x64/Agent Inbox.app.thin-report.json" \
            --output build/thin-handoff-evidence.json
          mkdir -p build/protected-handoff
          cp build/upstream-thin/thin-darwin-arm64.tar.gz build/protected-handoff/
          cp build/upstream-thin/thin-darwin-x64.tar.gz build/protected-handoff/
          cp build/source-release-context.json build/protected-handoff/release-context.json
          cp build/thin-handoff-evidence.json build/protected-handoff/
          test "$(find build/protected-handoff -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protected-thin-handoff
          path: build/protected-handoff
          if-no-files-found: error
          retention-days: 7

  sign-developer-id:
    name: Sign / ${{ needs.authorize.outputs.tag }} @ ${{ needs.authorize.outputs.source-commit }}
    needs:
      - authorize
      - verify-handoff
    runs-on: macos-15
    environment: macos-release
    env:
      APPLE_DEVELOPER_IDENTITY: ${{ vars.APPLE_DEVELOPER_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.source-commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.verify-handoff.outputs.node-version }}
          architecture: arm64
          cache: npm
      - run: npm ci
      - run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct '${{ needs.authorize.outputs.source-commit }}')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: protected-thin-handoff
          path: build/handoff
      - name: Restore exact thin inputs
        run: |
          mkdir -p build/thin
          node scripts/macos-release-gates.mjs verify-handoff \
            --context build/handoff/release-context.json \
            --arm64-archive build/handoff/thin-darwin-arm64.tar.gz \
            --x64-archive build/handoff/thin-darwin-x64.tar.gz \
            --handoff build/handoff/thin-handoff-evidence.json
          node scripts/archive-tree.mjs extract --archive build/handoff/thin-darwin-arm64.tar.gz --destination build/thin --expected-root darwin-arm64
          node scripts/archive-tree.mjs extract --archive build/handoff/thin-darwin-x64.tar.gz --destination build/thin --expected-root darwin-x64
          cp build/handoff/release-context.json build/release-context.json
      - id: signing
        name: Import and validate ephemeral Developer ID identity
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/import-apple-signing.sh import
      - name: Re-finalize exact thin apps with Developer ID
        env:
          AGENT_INBOX_RELEASE_SOURCE_SHA: ${{ needs.authorize.outputs.source-commit }}
        run: >-
          npm run package:macos --
          --mode developer-id
          --identity "${{ steps.signing.outputs.identity }}"
          --keychain "${{ steps.signing.outputs.keychain }}"
          --arm64-app "build/thin/darwin-arm64/Agent Inbox.app"
          --x64-app "build/thin/darwin-x64/Agent Inbox.app"
          --arm64-report "build/thin/darwin-arm64/Agent Inbox.app.thin-report.json"
          --x64-report "build/thin/darwin-x64/Agent Inbox.app.thin-report.json"
          --output out/developer-id
      - name: Remove ephemeral signing keychain and material
        if: ${{ always() }}
        run: scripts/import-apple-signing.sh cleanup
      - name: Stage exact Developer ID app and evidence
        run: |
          set -euo pipefail
          BASE="Agent-Inbox-${{ needs.authorize.outputs.version }}-macos-universal-developer-id"
          mkdir -p build/signed-transfer
          cp "out/developer-id/$BASE.tar.gz" build/signed-transfer/
          cp "out/developer-id/$BASE-verification.json" build/signed-transfer/
          cp build/release-context.json build/signed-transfer/
          node scripts/macos-release-gates.mjs identity \
            --output build/signed-transfer/signing-identity.json >/dev/null
          test "$(find build/signed-transfer -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-id-app
          path: build/signed-transfer
          if-no-files-found: error
          retention-days: 7
  verify-intel:
    name: Verify Intel / ${{ needs.authorize.outputs.tag }} @ ${{ needs.authorize.outputs.source-commit }}
    needs:
      - authorize
      - sign-developer-id
      - verify-handoff
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.source-commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.verify-handoff.outputs.node-version }}
          architecture: x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: developer-id-app
          path: build/signed
      - name: Restore exact Developer ID app bytes
        run: |
          set -euo pipefail
          BASE="Agent-Inbox-${{ needs.authorize.outputs.version }}-macos-universal-developer-id"
          mkdir -p build/intel-app
          node scripts/archive-tree.mjs extract \
            --archive "build/signed/$BASE.tar.gz" \
            --destination build/intel-app \
            --expected-root "Agent Inbox.app"
      - id: identity
        name: Load validated public signing identity
        run: >-
          node scripts/macos-release-gates.mjs identity
          --input build/signed/signing-identity.json
      - name: Verify exact Developer ID bytes natively on Intel
        run: >-
          node scripts/macos-release-gates.mjs intel-evidence
          --app "build/intel-app/Agent Inbox.app"
          --archive "build/signed/Agent-Inbox-${{ needs.authorize.outputs.version }}-macos-universal-developer-id.tar.gz"
          --report "build/signed/Agent-Inbox-${{ needs.authorize.outputs.version }}-macos-universal-developer-id-verification.json"
          --identity "${{ steps.identity.outputs.identity }}"
          --team "${{ steps.identity.outputs.team }}"
          --source "${{ needs.authorize.outputs.source-commit }}"
          --version "${{ needs.authorize.outputs.version }}"
          --output build/intel-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-id-intel-verification
          path: build/intel-verification.json
          if-no-files-found: error
          retention-days: 7

  notarize-and-finalize:
    name: Notarize / ${{ needs.authorize.outputs.tag }} @ ${{ needs.authorize.outputs.source-commit }}
    needs:
      - authorize
      - sign-developer-id
      - verify-intel
      - verify-handoff
    runs-on: macos-15
    environment: macos-release
    env:
      APPLE_DEVELOPER_IDENTITY: ${{ vars.APPLE_DEVELOPER_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.source-commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.verify-handoff.outputs.node-version }}
          architecture: arm64
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: developer-id-app
          path: build/signed
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: developer-id-intel-verification
          path: build/intel
      - name: Revalidate native Intel evidence
        run: |
          set -euo pipefail
          BASE="Agent-Inbox-${{ needs.authorize.outputs.version }}-macos-universal-developer-id"
          node scripts/macos-release-gates.mjs verify-intel-evidence \
            --archive "build/signed/$BASE.tar.gz" \
            --report "build/signed/$BASE-verification.json" \
            --evidence build/intel/intel-verification.json \
            --identity "$APPLE_DEVELOPER_IDENTITY" \
            --team "$APPLE_TEAM_ID" \
            --source "${{ needs.authorize.outputs.source-commit }}" \
            --version "${{ needs.authorize.outputs.version }}"
          mkdir -p build/final-app
          node scripts/archive-tree.mjs extract \
            --archive "build/signed/$BASE.tar.gz" \
            --destination build/final-app \
            --expected-root "Agent Inbox.app"
      - name: Package app for notarization
        run: >-
          /usr/bin/ditto -c -k --keepParent
          "build/final-app/Agent Inbox.app"
          "build/Agent-Inbox-${{ needs.authorize.outputs.version }}.zip"
      - name: Notarize and staple accepted app
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: >-
          scripts/notarize-macos.sh app
          "build/Agent-Inbox-${{ needs.authorize.outputs.version }}.zip"
          "build/final-app/Agent Inbox.app"
          build/app-notary-receipt.json
      - id: dmg-signing
        name: Import Developer ID identity for final DMG
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/import-apple-signing.sh import
      - name: Build and sign final DMG from stapled app
        run: |
          set -euo pipefail
          DMG="build/Agent-Inbox-${{ needs.authorize.outputs.tag }}-universal.dmg"
          node scripts/macos-release-gates.mjs build-dmg \
            --app "build/final-app/Agent Inbox.app" \
            --version "${{ needs.authorize.outputs.version }}" \
            --app-receipt build/app-notary-receipt.json \
            --icon electron/icon.icns \
            --output "$DMG"
          /usr/bin/codesign --force --sign "${{ steps.dmg-signing.outputs.identity }}" \
            --keychain "${{ steps.dmg-signing.outputs.keychain }}" \
            --timestamp "$DMG"
          /usr/bin/codesign --verify --verbose=2 "$DMG"
      - name: Remove ephemeral signing keychain and material
        if: ${{ always() }}
        run: scripts/import-apple-signing.sh cleanup
      - name: Notarize and staple accepted DMG
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: >-
          scripts/notarize-macos.sh dmg
          "build/Agent-Inbox-${{ needs.authorize.outputs.tag }}-universal.dmg"
          "build/Agent-Inbox-${{ needs.authorize.outputs.tag }}-universal.dmg"
          build/dmg-notary-receipt.json
      - name: Mount final stapled DMG and verify transported app
        run: >-
          node scripts/macos-release-gates.mjs verify-final-dmg
          --dmg "build/Agent-Inbox-${{ needs.authorize.outputs.tag }}-universal.dmg"
          --identity "$APPLE_DEVELOPER_IDENTITY"
          --team "$APPLE_TEAM_ID"
          --source "${{ needs.authorize.outputs.source-commit }}"
          --version "${{ needs.authorize.outputs.version }}"
          --output build/transported-app-evidence.json
      - name: Generate final post-staple evidence and checksums
        run: >-
          node scripts/macos-release-gates.mjs final-evidence
          --context build/signed/release-context.json
          --app "build/final-app/Agent Inbox.app"
          --app-receipt build/app-notary-receipt.json
          --dmg "build/Agent-Inbox-${{ needs.authorize.outputs.tag }}-universal.dmg"
          --dmg-receipt build/dmg-notary-receipt.json
          --transport-evidence build/transported-app-evidence.json
          --identity "$APPLE_DEVELOPER_IDENTITY"
          --team "$APPLE_TEAM_ID"
          --assets-dir build/release-assets
          --output build/release-evidence.json
      - name: Write release notes
        run: |
          printf '%s\n' \
            "# Agent Inbox ${{ needs.authorize.outputs.tag }}" \
            "" \
            "Universal macOS release for Apple silicon and Intel." \
            "Requires macOS 13.5 (Ventura) or later." \
            "The minimum reflects the pinned Node 24 runtime; Electron 43 itself supports macOS 12. Revisit this requirement before updating either pinned major." \
            "" \
            "## Install" \
            "1. Download and open \`Agent-Inbox-${{ needs.authorize.outputs.tag }}-universal.dmg\`." \
            "2. Drag Agent Inbox to Applications and launch it from Finder." \
            "3. Open Settings in Agent Inbox to install the Claude Code and/or Copilot CLI integration." \
            "" \
            "The bundled setup installs a verified Node 24 runtime under \`~/.agent-inbox/runtime/\`; moving the app later does not break the installed integration." \
            "" \
            "## Verify" \
            "\`\`\`sh" \
            "shasum -a 256 -c SHA256SUMS.txt" \
            "spctl --assess --type open --context context:primary-signature --verbose=4 Agent-Inbox-${{ needs.authorize.outputs.tag }}-universal.dmg" \
            "\`\`\`" \
            > build/RELEASE_NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-notarized-release
          path: |
            build/release-assets
            build/release-evidence.json
            build/signed/release-context.json
            build/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  verify-publication:
    name: Verify publication / ${{ needs.authorize.outputs.tag }} @ ${{ needs.authorize.outputs.source-commit }}
    needs:
      - authorize
      - notarize-and-finalize
      - verify-handoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.source-commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.verify-handoff.outputs.node-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-notarized-release
          path: build/final
      - name: Revalidate exact publication allowlist and evidence
        run: >-
          node scripts/macos-release-gates.mjs publication
          --context build/final/signed/release-context.json
          --assets-dir build/final/release-assets
          --evidence build/final/release-evidence.json
      - name: Bind exact verified publication handoff
        run: |
          set -euo pipefail
          mkdir -p build/verified-publish-handoff
          cp -R build/final/release-assets build/verified-publish-handoff/
          cp build/final/release-evidence.json build/verified-publish-handoff/
          cp build/final/signed/release-context.json build/verified-publish-handoff/release-context.json
          cp build/final/RELEASE_NOTES.md build/verified-publish-handoff/
          test "$(find build/verified-publish-handoff -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          test "$(find build/verified-publish-handoff/release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-publish-handoff
          path: build/verified-publish-handoff
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish / ${{ needs.authorize.outputs.tag }} @ ${{ needs.authorize.outputs.source-commit }}
    needs:
      - authorize
      - verify-publication
      - verify-handoff
    runs-on: ubuntu-latest
    environment: macos-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish exact verified handoff through a fail-closed draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
          RELEASE_SOURCE: ${{ needs.authorize.outputs.source-commit }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d "${RUNNER_TEMP}/agent-inbox-publish.XXXXXX")"
          CREATED=false
          PUBLISHED=false
          RELEASE_ID=
          cleanup() {
            local status=$?
            trap - EXIT
            if [[ "$CREATED" == true && "$PUBLISHED" != true ]]; then
              if [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
                gh api --method DELETE "repos/$GH_REPO/releases/$RELEASE_ID" >/dev/null 2>&1 || true
              else
                gh release delete "$RELEASE_TAG" --repo "$GH_REPO" --yes >/dev/null 2>&1 || true
              fi
            fi
            rm -rf "$WORK"
            exit "$status"
          }
          trap cleanup EXIT
          check_remote_tag() {
            local tag_ref tag_object_type tag_object_sha tag_object peeled_type peeled_sha
            tag_ref="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
            tag_object_type="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.object?.type || "")' "$tag_ref")"
            tag_object_sha="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.object?.sha || "")' "$tag_ref")"
            test "$tag_object_type" = tag
            test -n "$tag_object_sha"
            tag_object="$(gh api "repos/$GH_REPO/git/tags/$tag_object_sha")"
            peeled_type="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.object?.type || "")' "$tag_object")"
            peeled_sha="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.object?.sha || "")' "$tag_object")"
            test "$peeled_type" = commit
            test "$peeled_sha" = "$RELEASE_SOURCE"
          }

          gh run download "$GITHUB_RUN_ID" \
            --repo "$GH_REPO" \
            --name verified-publish-handoff \
            --dir "$WORK"

          node - "$WORK" "$RELEASE_TAG" "$RELEASE_VERSION" "$RELEASE_SOURCE" <<'NODE'
          const { createHash } = require('node:crypto')
          const { readFileSync, readdirSync, statSync } = require('node:fs')
          const { join } = require('node:path')
          const [root, tag, version, source] = process.argv.slice(2)
          const fail = (message) => { throw new Error(message) }
          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'))
          const sha256 = (path) => createHash('sha256').update(readFileSync(path)).digest('hex')
          const exact = (actual, expected, label) => {
            if (JSON.stringify([...actual].sort()) !== JSON.stringify([...expected].sort())) {
              fail(`${label} allowlist mismatch`)
            }
          }

          exact(readdirSync(root), [
            'RELEASE_NOTES.md',
            'release-assets',
            'release-context.json',
            'release-evidence.json',
          ], 'publish handoff')
          const dmgName = `Agent-Inbox-${tag}-universal.dmg`
          const assets = join(root, 'release-assets')
          exact(readdirSync(assets), [dmgName, 'SHA256SUMS.txt'], 'release asset')
          const dmg = join(assets, dmgName)
          const checksum = sha256(dmg)
          if (readFileSync(join(assets, 'SHA256SUMS.txt'), 'utf8') !== `${checksum}  ${dmgName}\n`) {
            fail('post-staple checksum mismatch')
          }
          if (statSync(join(root, 'RELEASE_NOTES.md')).size === 0) fail('release notes are empty')

          const context = readJson(join(root, 'release-context.json'))
          exact(Object.keys(context), ['annotated', 'schema', 'sourceCommit', 'tag', 'version'], 'release context')
          if (
            context.schema !== 1 ||
            context.annotated !== true ||
            context.tag !== tag ||
            context.version !== version ||
            context.sourceCommit !== source
          ) fail('release context mismatch')

          const evidence = readJson(join(root, 'release-evidence.json'))
          const verification = evidence.verification || {}
          const transported = evidence.transportedApp || {}
          exact(Object.keys(verification), [
            'appCodesign',
            'appGatekeeper',
            'appStapler',
            'checksumAfterStaple',
            'dmgCodesign',
            'dmgGatekeeper',
            'dmgIdentity',
            'dmgStapler',
            'transportedApp',
          ], 'verification')
          if (
            evidence.schema !== 1 ||
            evidence.tag !== tag ||
            evidence.packageVersion !== version ||
            evidence.sourceCommit !== source ||
            evidence.annotatedTag !== true ||
            evidence.finalDmgName !== dmgName ||
            evidence.finalDmgSha256 !== checksum ||
            evidence.appNotarization?.status !== 'Accepted' ||
            evidence.dmgNotarization?.status !== 'Accepted' ||
            !evidence.appNotarization?.submissionId ||
            evidence.appNotarization.submissionId === evidence.dmgNotarization?.submissionId ||
            transported.schema !== 1 ||
            transported.status !== 'passed' ||
            transported.sourceCommit !== source ||
            transported.packageVersion !== version ||
            transported.finalDmgSha256 !== checksum ||
            transported.identity !== evidence.identity ||
            transported.teamId !== evidence.teamId ||
            transported.dmgSignatureIdentity !== 'passed' ||
            transported.copiedAppCodesign !== 'passed' ||
            transported.copiedAppStapler !== 'passed' ||
            transported.copiedAppGatekeeper !== 'passed' ||
            transported.universalEnvelope !== 'passed' ||
            transported.runtimeManifests !== 'passed' ||
            transported.releaseSetupInfo !== 'passed' ||
            transported.loopbackLaunch !== 'passed' ||
            transported.portableRuntimeLifecycle !== 'passed' ||
            verification.appCodesign !== 'passed' ||
            verification.appGatekeeper !== 'passed' ||
            verification.appStapler !== 'passed' ||
            verification.dmgCodesign !== 'passed' ||
            verification.dmgGatekeeper !== 'passed' ||
            verification.dmgIdentity !== 'passed' ||
            verification.dmgStapler !== 'passed' ||
            verification.transportedApp !== 'passed' ||
            verification.checksumAfterStaple !== true
          ) fail('release evidence does not authorize publication')
          NODE

          set +e
          EXISTING="$(gh api --include "repos/$GH_REPO/releases/tags/$RELEASE_TAG" 2>&1)"
          EXISTING_STATUS=$?
          set -e
          if [[ "$EXISTING_STATUS" == 0 ]]; then
            echo "release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          if ! grep -Eq '^HTTP/[^ ]+ 404' <<<"$EXISTING"; then
            echo "could not prove release $RELEASE_TAG is absent" >&2
            exit 1
          fi

          check_remote_tag

          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --verify-tag \
            --draft \
            --title "Agent Inbox $RELEASE_TAG" \
            --notes-file "$WORK/RELEASE_NOTES.md"
          CREATED=true
          RELEASE_ID="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json databaseId --jq .databaseId)"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh release upload "$RELEASE_TAG" \
            "$WORK/release-assets/Agent-Inbox-$RELEASE_TAG-universal.dmg" \
            "$WORK/release-assets/SHA256SUMS.txt" \
            --repo "$GH_REPO"
          gh release view "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --json tagName,isDraft,assets > "$WORK/remote.json"
          REMOTE_MODE="$(node - "$WORK/remote.json" "$RELEASE_TAG" "$WORK/release-assets" <<'NODE'
          const { createHash } = require('node:crypto')
          const { readFileSync } = require('node:fs')
          const { join } = require('node:path')
          const [path, tag, assetsDir] = process.argv.slice(2)
          const release = JSON.parse(readFileSync(path, 'utf8'))
          const actual = (release.assets || []).map(({ name, size, digest }) => ({ name, size, digest }))
          const names = [`Agent-Inbox-${tag}-universal.dmg`, 'SHA256SUMS.txt']
          if (
            release.tagName !== tag ||
            release.isDraft !== true ||
            actual.length !== names.length ||
            names.some((name) => !actual.some((asset) => asset.name === name && asset.size > 0))
          ) throw new Error('remote draft does not match the exact nonempty asset allowlist')
          const sha256 = (name) => `sha256:${createHash('sha256').update(readFileSync(join(assetsDir, name))).digest('hex')}`
          const completeDigests = actual.every((asset) => /^sha256:[0-9a-f]{64}$/i.test(asset.digest || ''))
          if (completeDigests) {
            for (const name of names) {
              if (actual.find((asset) => asset.name === name).digest.toLowerCase() !== sha256(name)) {
                throw new Error(`remote asset digest mismatch for ${name}`)
              }
            }
            process.stdout.write('digest')
          } else {
            process.stdout.write('download')
          }
          NODE
          )"
          if [[ "$REMOTE_MODE" == download ]]; then
            mkdir -p "$WORK/remote-assets"
            gh release download "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --pattern "Agent-Inbox-$RELEASE_TAG-universal.dmg" \
              --pattern SHA256SUMS.txt \
              --dir "$WORK/remote-assets"
            cmp "$WORK/release-assets/SHA256SUMS.txt" "$WORK/remote-assets/SHA256SUMS.txt"
            cmp "$WORK/release-assets/Agent-Inbox-$RELEASE_TAG-universal.dmg" \
              "$WORK/remote-assets/Agent-Inbox-$RELEASE_TAG-universal.dmg"
            (
              cd "$WORK/remote-assets"
              shasum -a 256 -c SHA256SUMS.txt
            )
          elif [[ "$REMOTE_MODE" != digest ]]; then
            echo "remote asset verification did not produce a valid mode" >&2
            exit 1
          fi
          check_remote_tag
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false >/dev/null
          PUBLISHED=true
