name: Multi-platform release inputs

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Every npm install in this workflow compiles better-sqlite3 rather than load an
  # unpinned prebuild; no job or step may override it (#315).
  npm_config_build_from_source: "true"

jobs:
  linux-x64-appimage:
    permissions:
      contents: read
    uses: ./.github/workflows/linux-x64-appimage.yml

  linux-arm64-appimage:
    permissions:
      contents: read
    uses: ./.github/workflows/linux-arm64-appimage.yml

  linux-x64-deb:
    permissions:
      contents: read
    uses: ./.github/workflows/linux-x64-deb.yml

  linux-arm64-deb:
    permissions:
      contents: read
    uses: ./.github/workflows/linux-arm64-deb.yml

  validate-tag:
    name: Validate annotated release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      source-commit: ${{ steps.tag.outputs.source-commit }}
      node-version: ${{ steps.release-inputs.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - id: release-inputs
        name: Resolve pinned Node version
        run: echo "node-version=$(node scripts/release-inputs.mjs --node-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.release-inputs.outputs.node-version }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:inputs
      - id: tag
        name: Require annotated tag, exact version, and exact checkout
        run: >-
          node scripts/macos-release-gates.mjs tag
          --repo-root "$GITHUB_WORKSPACE"
          --ref "$GITHUB_REF"
          --sha "$GITHUB_SHA"
          --output build/release-context.json
      - run: npx vitest run test/macos-release-gates.test.ts test/macos-release-workflow.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-context
          path: build/release-context.json
          if-no-files-found: error
          retention-days: 7

  runtime:
    name: Release runtime / darwin-arm64
    needs: validate-tag
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.validate-tag.outputs.node-version }}
          architecture: arm64
          package-manager-cache: false
      - run: npm ci
      - run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct '${{ needs.validate-tag.outputs.source-commit }}')" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Stage verified native runtime
        run: >-
          npm run stage:runtime:native --
          --key darwin-arm64
          --output build/runtime/darwin-arm64
      - name: Preserve runtime modes
        run: >-
          node scripts/archive-tree.mjs create
          --source build/runtime/darwin-arm64
          --archive build/darwin-arm64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-runtime-darwin-arm64
          path: build/darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  thin:
    name: Release thin app / darwin-arm64
    needs:
      - validate-tag
      - runtime
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.validate-tag.outputs.node-version }}
          architecture: arm64
          package-manager-cache: false
      - run: npm ci
      - run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct '${{ needs.validate-tag.outputs.source-commit }}')" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-runtime-darwin-arm64
          path: build/runtime-artifacts
      - name: Restore the verified runtime payload
        run: |
          mkdir -p build/runtimes
          node scripts/archive-tree.mjs extract --archive build/runtime-artifacts/darwin-arm64.tar.gz --destination build/runtimes --expected-root darwin-arm64
      - name: Build the Apple silicon thin app from release tag
        run: >-
          npm run package:thin --
          --runtime-arm64 build/runtimes/darwin-arm64
          --output "build/thin/darwin-arm64/Agent Inbox.app"
      - name: Preserve thin app symlinks and modes
        run: >-
          node scripts/archive-tree.mjs create
          --source build/thin/darwin-arm64
          --archive build/thin-darwin-arm64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-thin-darwin-arm64
          path: build/thin-darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7
