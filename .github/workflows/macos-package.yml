name: macOS package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every npm install in this workflow compiles better-sqlite3 rather than load an
  # unpinned prebuild; no job or step may override it (#315).
  npm_config_build_from_source: "true"

jobs:
  inputs:
    name: Validate pinned release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release-inputs
        name: Resolve pinned Node version
        run: echo "node-version=$(node scripts/release-inputs.mjs --node-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.release-inputs.outputs.node-version }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:inputs
      - run: npx vitest run test/release-inputs.test.ts test/release-pipeline.test.ts test/app-dependencies.test.ts

  runtime:
    name: Native runtime / darwin-arm64
    needs: inputs
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release-inputs
        name: Resolve pinned Node version
        run: echo "node-version=$(node scripts/release-inputs.mjs --node-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.release-inputs.outputs.node-version }}
          architecture: arm64
          package-manager-cache: false
      - run: npm ci
      - name: Verify native Setup lock lease
        run: npx vitest run test/setup-lock.test.ts
      - run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Stage verified native runtime
        run: >-
          npm run stage:runtime:native --
          --key darwin-arm64
          --output build/runtime/darwin-arm64
      - name: Preserve runtime modes
        run: >-
          node scripts/archive-tree.mjs create
          --source build/runtime/darwin-arm64
          --archive build/darwin-arm64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-darwin-arm64
          path: build/darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  thin:
    name: Thin Electron app / darwin-arm64
    needs: runtime
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release-inputs
        name: Resolve pinned Node version
        run: echo "node-version=$(node scripts/release-inputs.mjs --node-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.release-inputs.outputs.node-version }}
          architecture: arm64
          package-manager-cache: false
      - run: npm ci
      - run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-darwin-arm64
          path: build/runtime-artifacts
      - name: Restore the runtime payload
        run: |
          mkdir -p build/runtimes
          node scripts/archive-tree.mjs extract --archive build/runtime-artifacts/darwin-arm64.tar.gz --destination build/runtimes --expected-root darwin-arm64
      - name: Build the Apple silicon thin app
        run: >-
          npm run package:thin --
          --runtime-arm64 build/runtimes/darwin-arm64
          --output "build/thin/darwin-arm64/Agent Inbox.app"
      - name: Preserve app symlinks and modes
        run: >-
          node scripts/archive-tree.mjs create
          --source build/thin/darwin-arm64
          --archive build/thin-darwin-arm64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thin-darwin-arm64
          path: build/thin-darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  package:
    name: Ad-hoc app and provisional DMG
    needs: thin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release-inputs
        name: Resolve pinned Node version
        run: echo "node-version=$(node scripts/release-inputs.mjs --node-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.release-inputs.outputs.node-version }}
          architecture: arm64
          package-manager-cache: false
      - run: npm ci
      - run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thin-darwin-arm64
          path: build/thin-artifacts
      - name: Restore the thin app
        run: |
          mkdir -p build/thin
          node scripts/archive-tree.mjs extract --archive build/thin-artifacts/thin-darwin-arm64.tar.gz --destination build/thin --expected-root darwin-arm64
      - name: Finalize, sign ad-hoc, and create provisional DMG
        run: >-
          npm run package:macos --
          --mode adhoc
          --arm64-app "build/thin/darwin-arm64/Agent Inbox.app"
          --arm64-report "build/thin/darwin-arm64/Agent Inbox.app.thin-report.json"
          --output out/macos-package
      - name: Mount, copy, launch, verify boundary, and remove portable runtime
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find out/macos-package -maxdepth 1 -name '*-provisional.dmg' -print -quit)"
          MOUNT="$RUNNER_TEMP/agent-inbox-dmg"
          COPIED="$RUNNER_TEMP/Agent Inbox.app"
          TEST_HOME="$RUNNER_TEMP/agent-inbox-home"
          mkdir -p "$MOUNT" "$TEST_HOME"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          ditto "$MOUNT/Agent Inbox.app" "$COPIED"
          codesign --verify --deep --strict --verbose=2 "$COPIED"
          # Only US and British English ship (#292). Launched as a French user
          # the app must fall back to en-US, as a British one keep en-GB, and
          # its renderers and page dates must follow.
          launch_as() {
            local language="$1" port="$2" expected="$3" locales=""
            HOME="$TEST_HOME" AGENT_INBOX_PORT="$port" "$COPIED/Contents/MacOS/Agent Inbox" \
              -AppleLanguages "($language)" --remote-debugging-port="$((port + 100))" \
              >"$RUNNER_TEMP/agent-inbox-$language.log" 2>&1 &
            APP_PID=$!
            for _ in {1..60}; do
              curl -fsSI "http://127.0.0.1:$port/" | grep -qi '^x-agent-inbox-local-boundary: loopback-v1' && break
              sleep 1
            done
            curl -fsSI "http://127.0.0.1:$port/" | grep -qi '^x-agent-inbox-local-boundary: loopback-v1'
            for _ in {1..30}; do
              locales="$(pgrep -lf -P "$APP_PID" -- '--type=renderer' | grep -o -- '--lang=[^ ]*' | sort -u | paste -sd ' ' - || true)"
              [ -n "$locales" ] && break
              sleep 1
            done
            echo "Renderer locale with -AppleLanguages ($language): ${locales:-none}"
            test "$locales" = "--lang=$expected"
            node scripts/launch-locale-probe.mjs --devtools-port "$((port + 100))" --viewer-port "$port" --expect "$expected"
          }
          APP_PID=""
          trap 'kill "$APP_PID" >/dev/null 2>&1 || true; hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          launch_as fr 14319 en-US
          RUNTIME="$COPIED/Contents/Resources/app/runtime/darwin-arm64"
          "$RUNTIME/bin/node" "$RUNTIME/scripts/runtime-payload.mjs" install \
            --payload-root "$RUNTIME" --runtime-root "$TEST_HOME/.agent-inbox/runtime" >"$RUNNER_TEMP/runtime-install.json"
          RUNTIME_ID="$(node -p "JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/runtime-install.json')).runtimeId")"
          "$RUNTIME/bin/node" "$RUNTIME/scripts/runtime-payload.mjs" prune \
            --runtime-root "$TEST_HOME/.agent-inbox/runtime" --runtime-id "$RUNTIME_ID"
          kill "$APP_PID"
          wait "$APP_PID" || true
          launch_as en-GB 14320 en-GB
          kill "$APP_PID"
          wait "$APP_PID" || true
          rm -rf "$COPIED" "$TEST_HOME"
          hdiutil detach "$MOUNT"
          trap - EXIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-provisional
          path: out/macos-package
          if-no-files-found: error
          retention-days: 7
      - name: Retain reproducible Layer 3 inputs
        run: |
          mkdir -p out/layer3-inputs
          cp build/thin-artifacts/*.tar.gz release/macos-inputs.json out/layer3-inputs/
          shasum -a 256 out/layer3-inputs/* > out/layer3-inputs/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-layer3-reproducible-inputs
          path: out/layer3-inputs
          if-no-files-found: error
          retention-days: 7

